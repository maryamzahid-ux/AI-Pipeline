<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      color: #fff;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
    .search-bar input:focus { border-color: rgba(255,255,255,0.4); }

    .search-bar button {
      padding: 12px 20px;
      background: #e94560;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .search-bar button:hover { background: #c73652; }
    .search-bar button:active { transform: scale(0.97); }

    .unit-toggle {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .unit-toggle button {
      padding: 8px 20px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 10px;
    }

    .unit-toggle button.active {
      background: #e94560;
      color: #fff;
    }

    .error-msg {
      color: #ff6b7a;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      margin-bottom: 24px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .weather-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 480px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .city-name {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .weather-condition {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .weather-emoji {
      font-size: 3.5rem;
      line-height: 1;
    }

    .temperature {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 28px;
    }

    .temperature sup {
      font-size: 1.8rem;
      font-weight: 600;
      vertical-align: super;
      letter-spacing: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    @media (max-width: 375px) {
      header h1 { font-size: 1.6rem; }
      .temperature { font-size: 3.2rem; }
      .weather-emoji { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Weather App</h1>
    <p>Get real-time weather for any city</p>
  </header>

  <div class="search-bar">
    <input type="text" id="cityInput" placeholder="Search city…" autocomplete="off">
    <button id="searchBtn" onclick="handleSearch()">Search</button>
  </div>

  <div class="unit-toggle">
    <button id="btnC" class="active" onclick="setUnit('C')">°C</button>
    <button id="btnF" onclick="setUnit('F')">°F</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="loader" id="loader"></div>

  <div class="weather-card" id="weatherCard">
    <div class="card-top">
      <div>
        <div class="city-name" id="cityName"></div>
        <div class="weather-condition" id="weatherCondition"></div>
      </div>
      <div class="weather-emoji" id="weatherEmoji"></div>
    </div>
    <div class="temperature">
      <span id="tempValue"></span><sup id="tempUnit">°C</sup>
    </div>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Humidity</div>
        <div class="stat-value" id="humidity">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Wind Speed</div>
        <div class="stat-value" id="windSpeed">—</div>
      </div>
    </div>
  </div>

  <script>
    const GEOCODING_URL = 'https://geocoding-api.open-meteo.com/v1/search';
    const WEATHER_URL   = 'https://api.open-meteo.com/v1/forecast';

    let currentTempC = null;
    let currentUnit  = 'C';

    const WMO_EMOJI = {
      0:  '☀️',
      1:  '🌤️',
      2:  '⛅',
      3:  '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌧️',
      56: '🌧️', 57: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      66: '🌧️', 67: '🌧️',
      71: '🌨️', 73: '🌨️', 75: '🌨️', 77: '🌨️',
      80: '🌦️', 81: '🌧️', 82: '🌧️',
      85: '🌨️', 86: '🌨️',
      95: '⛈️', 96: '⛈️', 99: '⛈️',
    };

    const WMO_DESC = {
      0:  'Clear Sky',
      1:  'Mainly Clear',
      2:  'Partly Cloudy',
      3:  'Overcast',
      45: 'Foggy', 48: 'Icy Fog',
      51: 'Light Drizzle', 53: 'Moderate Drizzle', 55: 'Dense Drizzle',
      56: 'Light Freezing Drizzle', 57: 'Heavy Freezing Drizzle',
      61: 'Slight Rain', 63: 'Moderate Rain', 65: 'Heavy Rain',
      66: 'Light Freezing Rain', 67: 'Heavy Freezing Rain',
      71: 'Slight Snowfall', 73: 'Moderate Snowfall', 75: 'Heavy Snowfall',
      77: 'Snow Grains',
      80: 'Slight Rain Showers', 81: 'Moderate Rain Showers', 82: 'Heavy Rain Showers',
      85: 'Slight Snow Showers', 86: 'Heavy Snow Showers',
      95: 'Thunderstorm', 96: 'Thunderstorm + Hail', 99: 'Thunderstorm + Heavy Hail',
    };

    function cToF(c) { return +(c * 9 / 5 + 32).toFixed(1); }

    function setUnit(unit) {
      currentUnit = unit;
      document.getElementById('btnC').classList.toggle('active', unit === 'C');
      document.getElementById('btnF').classList.toggle('active', unit === 'F');
      if (currentTempC !== null) renderTemperature();
    }

    function renderTemperature() {
      const val = currentUnit === 'C' ? currentTempC : cToF(currentTempC);
      document.getElementById('tempValue').textContent = val;
      document.getElementById('tempUnit').textContent  = '°' + currentUnit;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    function showLoader() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('weatherCard').style.display = 'none';
    }

    function hideLoader() {
      document.getElementById('loader').style.display = 'none';
    }

    async function handleSearch() {
      const raw = document.getElementById('cityInput').value.trim();
      if (!raw) return;
      await searchCity(raw);
    }

    async function searchCity(cityQuery) {
      showLoader();
      hideError();

      try {
        const geoRes  = await fetch(`${GEOCODING_URL}?name=${encodeURIComponent(cityQuery)}&count=1&language=en&format=json`);
        if (!geoRes.ok) throw new Error('Geocoding request failed');
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          showError('City not found. Try a different name.');
          return;
        }

        const { latitude, longitude, name, country } = geoData.results[0];
        await fetchWeather(latitude, longitude, country ? `${name}, ${country}` : name);
        localStorage.setItem('lastCity', cityQuery);
      } catch (err) {
        showError('Something went wrong. Check your connection and try again.');
      } finally {
        hideLoader();
      }
    }

    async function fetchWeather(lat, lon, displayName) {
      const url = `${WEATHER_URL}?latitude=${lat}&longitude=${lon}` +
                  `&current=temperature_2m,relative_humidity_2m,weathercode,windspeed_10m` +
                  `&windspeed_unit=kmh`;
      const res  = await fetch(url);
      if (!res.ok) throw new Error('Weather request failed');
      const data = await res.json();
      const c    = data.current;

      currentTempC = c.temperature_2m;
      const code   = c.weathercode;

      document.getElementById('cityName').textContent        = displayName;
      document.getElementById('weatherCondition').textContent = WMO_DESC[code] ?? 'Unknown';
      document.getElementById('weatherEmoji').textContent    = WMO_EMOJI[code] ?? '🌡️';
      document.getElementById('humidity').textContent        = c.relative_humidity_2m + '%';
      document.getElementById('windSpeed').textContent       = c.windspeed_10m + ' km/h';

      renderTemperature();
      document.getElementById('weatherCard').style.display = 'block';
    }

    document.getElementById('cityInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleSearch();
    });

    (function init() {
      const last = localStorage.getItem('lastCity');
      if (last) {
        document.getElementById('cityInput').value = last;
        searchCity(last);
      }
    })();
  </script>
</body>
</html>
